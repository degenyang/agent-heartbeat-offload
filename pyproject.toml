[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-heartbeat-offload"
version = "0.1.0"
description = "Move deterministic AI-agent scheduled workflows to the OS scheduler (Task Scheduler / cron / systemd / launchd) and monitor everything with heartbeats."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
yaml = ["PyYAML>=6"]
test = ["pytest>=7"]

[project.scripts]
aho = "aho.cli:main"

[tool.setuptools]
packages = ["aho"]

[tool.pytest.ini_options]
testpaths = ["tests"]
